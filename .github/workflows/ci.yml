name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      pre_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "KOTLINC=$(cygpath -w "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc.bat")" >> "$GITHUB_ENV"
          else
            chmod +x "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc"
            echo "KOTLINC=$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: npm ci
      - run: npm run build:cf-tool
      - run: npm run verify:cf-tool
      - run: npm run build:downloader
        env:
          CFIDE_BUILD_PYTHON: python
      - run: npm run check
      - run: npm run package
        env:
          ACSTRIDE_PRE_RELEASE: ${{ inputs.pre_release && 'true' || 'false' }}
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cfide-${{ matrix.target }}
          path: '*.vsix'
