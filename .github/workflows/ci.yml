name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: npm ci
      - run: npm run build:cf-tool
      - run: npm run verify:cf-tool
      - run: npm run build:downloader
        env:
          CFIDE_BUILD_PYTHON: python
      - run: npm run check
      - run: npm run package
      - run: npm run verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cfide-${{ matrix.target }}
          path: '*.vsix'
